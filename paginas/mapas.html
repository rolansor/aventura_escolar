<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Mapa del Ecuador — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/mapas.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-mapas" class="pantalla activa">
      <h2 class="titulo-seccion">🗺️ Mapa del Ecuador</h2>
      <p class="subtitulo" id="mapa-sub">Pasa el cursor para ver datos · clic para que salte · doble clic para ampliarla 🔎</p>
      <div class="mapa-leyenda" id="mapa-leyenda"></div>
      <div class="mapa-zona" id="mapa-zona">
        <div class="mapa-col-mapa">
          <div id="mapa-svg-cont" class="mapa-svg-cont"></div>
        </div>
        <aside class="mapa-detalle oculto" id="mapa-detalle"></aside>
      </div>
      <div id="mapa-tooltip" class="mapa-tooltip oculto"></div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/mapa-ec.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/mapas.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () { location.href = "index.html?materia=sociales"; };
    Datos.cargar(["mapa-ec"]).then(function () {
      Juego.iniciarBase();
      Mapas.init();
      Mapas.mostrar();
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
