<!-- La flor con lupa — flor cortada por la mitad, como en los libros, para ver cada pieza
     por separado. La usa "Cómo se reproducen las plantas" (data/contenido/reproplantas.json):
     para soltar cada trabajo sobre su parte (clasificar con dibujo) y para tocarla (senala).
     Partes: petalo, sepalo, filamento, antera, ovario, estilo, estigma.
     Las piezas finas (filamento, estilo) llevan un trazo transparente y gordo para el dedo. -->
<svg viewBox="0 0 300 340" class="sen-svg sen-flor" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fc-petalo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="#f7b0d8"/><stop offset="1" stop-color="#e2569c"/>
    </linearGradient>
    <linearGradient id="fc-fondo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff8dc"/><stop offset="1" stop-color="#f6c1e0"/>
    </linearGradient>
  </defs>

  <!-- tallo y base de la flor (no son partes del juego) -->
  <g pointer-events="none">
    <path d="M150 338 V292" fill="none" stroke="#3f9d4b" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="150" cy="284" rx="40" ry="11" fill="#3f9d4b" stroke="#2a7d39" stroke-width="2"/>
  </g>

  <!-- PÉTALOS (el del fondo primero) -->
  <g data-parte="petalo" stroke="#c23a80" stroke-width="2" stroke-linejoin="round">
    <path d="M150 262 C104 210 100 92 150 26 C200 92 196 210 150 262 Z" fill="url(#fc-fondo)"/>
    <path d="M130 276 C70 258 12 194 20 92 C80 108 126 192 138 268 Z" fill="url(#fc-petalo)"/>
    <path d="M170 276 C230 258 288 194 280 92 C220 108 174 192 162 268 Z" fill="url(#fc-petalo)"/>
  </g>

  <!-- SÉPALOS (debajo de los pétalos) -->
  <g data-parte="sepalo" fill="#3fa34d" stroke="#2a7d39" stroke-width="2" stroke-linejoin="round">
    <path d="M118 284 C86 290 50 276 34 248 C72 244 104 258 124 276 Z"/>
    <path d="M182 284 C214 290 250 276 266 248 C228 244 196 258 176 276 Z"/>
  </g>

  <!-- FILAMENTOS (los palitos que sostienen las anteras) -->
  <g data-parte="filamento" fill="none" stroke-linecap="round">
    <g stroke="transparent" stroke-width="20">
      <path d="M118 276 C100 232 88 186 84 150"/><path d="M127 274 C117 222 113 164 114 120"/>
      <path d="M182 276 C200 232 212 186 216 150"/><path d="M173 274 C183 222 187 164 186 120"/>
    </g>
    <g stroke="#a98a1c" stroke-width="7">
      <path d="M118 276 C100 232 88 186 84 150"/><path d="M127 274 C117 222 113 164 114 120"/>
      <path d="M182 276 C200 232 212 186 216 150"/><path d="M173 274 C183 222 187 164 186 120"/>
    </g>
    <g stroke="#fff3b0" stroke-width="4">
      <path d="M118 276 C100 232 88 186 84 150"/><path d="M127 274 C117 222 113 164 114 120"/>
      <path d="M182 276 C200 232 212 186 216 150"/><path d="M173 274 C183 222 187 164 186 120"/>
    </g>
  </g>

  <!-- ANTERAS (las bolsitas con polen) -->
  <g data-parte="antera">
    <g fill="#f2a007" stroke="#b86f00" stroke-width="2">
      <ellipse cx="81" cy="138" rx="11" ry="18" transform="rotate(-26 81 138)"/>
      <ellipse cx="113" cy="106" rx="11" ry="18" transform="rotate(-6 113 106)"/>
      <ellipse cx="219" cy="138" rx="11" ry="18" transform="rotate(26 219 138)"/>
      <ellipse cx="187" cy="106" rx="11" ry="18" transform="rotate(6 187 106)"/>
    </g>
    <g fill="#ffe27a">
      <circle cx="78" cy="132" r="2.4"/><circle cx="84" cy="142" r="2.4"/><circle cx="111" cy="100" r="2.4"/><circle cx="115" cy="111" r="2.4"/>
      <circle cx="222" cy="132" r="2.4"/><circle cx="216" cy="142" r="2.4"/><circle cx="189" cy="100" r="2.4"/><circle cx="185" cy="111" r="2.4"/>
    </g>
  </g>

  <!-- ESTILO (el tubito del pistilo) -->
  <g data-parte="estilo" fill="none" stroke-linecap="butt">
    <path d="M150 212 V92" stroke="transparent" stroke-width="26"/>
    <path d="M150 212 V92" stroke="#6f9f2c" stroke-width="13"/>
    <path d="M150 212 V92" stroke="#b5dd6b" stroke-width="9"/>
  </g>

  <!-- OVARIO (abajo, cortado: se ven los óvulos) -->
  <g data-parte="ovario">
    <ellipse cx="150" cy="242" rx="27" ry="36" fill="#9ccc55" stroke="#6f9f2c" stroke-width="2.5"/>
    <ellipse cx="150" cy="244" rx="17" ry="25" fill="#f3fad9" stroke="#b5dd6b" stroke-width="1.5"/>
    <g fill="#ffe27a" stroke="#c9a400" stroke-width="1.5">
      <circle cx="145" cy="230" r="5.5"/><circle cx="156" cy="243" r="5.5"/><circle cx="145" cy="257" r="5.5"/>
    </g>
  </g>

  <!-- ESTIGMA (la punta pegajosa del pistilo) -->
  <g data-parte="estigma">
    <circle cx="150" cy="80" r="23" fill="transparent"/>
    <path d="M129 90 Q150 56 171 90 Q150 104 129 90 Z" fill="#ffd23f" stroke="#c9a400" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#fff6c9"><circle cx="142" cy="84" r="2.6"/><circle cx="150" cy="76" r="2.6"/><circle cx="158" cy="85" r="2.6"/></g>
  </g>
</svg>
