<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Secuencias — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/ejercicios.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-secuencias" class="pantalla activa">
      <div id="secuencias-selector" class="selector-categorias"></div>
      <div id="secuencias-juego" class="caja-juego oculto">
        <div class="fila-timer"><span class="timer oculto" id="sec-timer"></span></div>
        <div class="progreso"><div class="progreso-barra" id="sec-progreso"></div></div>
        <p class="regla-ayuda" id="sec-regla"></p>
        <h2 class="pregunta secuencia-numeros" id="sec-pregunta"></h2>
        <p class="pista" id="sec-pista"></p>
        <div class="zona-respuesta-libre" id="sec-respuesta">
          <input type="number" id="sec-input" class="entrada-texto" autocomplete="off" placeholder="¿?" />
          <button class="boton-grande" id="sec-enviar">Comprobar</button>
        </div>
        <button class="boton-secundario" id="sec-pista-btn">💡 Ver pista</button>
        <p class="retro" id="sec-retro"></p>
      </div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/secuencias.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/secuencias.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () {
      const juego = document.getElementById("secuencias-juego");
      if (juego && !juego.classList.contains("oculto")) Secuencias.volverSelector();
      else location.href = "index.html?materia=matematicas";
    };
    Datos.cargar(["secuencias"]).then(function () {
      Juego.iniciarBase();
      Secuencias.init();
      document.getElementById("sec-enviar").onclick = function () { Secuencias.comprobar(); };
      document.getElementById("sec-input").addEventListener("keydown", function (e) { if (e.key === "Enter") Secuencias.comprobar(); });
      document.getElementById("sec-pista-btn").onclick = function () { Secuencias.verPista(); };
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
