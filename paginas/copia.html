<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Copia y Dictado — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/ejercicios.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-copia" class="pantalla activa">
      <div id="copia-selector" class="selector-categorias"></div>
      <div id="copia-juego" class="caja-juego oculto">
        <div class="fila-timer"><span class="timer oculto" id="copia-timer"></span></div>
        <div class="toggle-modo">
          <button class="opcion-modo activa" data-cmodo="corregir">🔍 Corregir errores</button>
          <button class="opcion-modo" data-cmodo="copiar">📝 Copiar igual</button>
        </div>
        <p class="regla-ayuda" id="copia-regla"></p>
        <div class="texto-modelo" id="copia-modelo"></div>
        <button class="boton-secundario oculto" id="copia-pista">💡 Señalar los errores</button>
        <textarea id="copia-input" class="entrada-area" placeholder="Escribe aquí el texto…"></textarea>
        <button class="boton-grande" id="copia-comprobar">Comprobar</button>
        <div class="resultado-copia" id="copia-resultado"></div>
      </div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/parrafos.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/copia.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () {
      const juego = document.getElementById("copia-juego");
      if (juego && !juego.classList.contains("oculto")) Copia.volverSelector();
      else location.href = "index.html?materia=lengua";
    };
    Datos.cargar(["parrafos"]).then(function () {
      Juego.iniciarBase();
      Copia.init();
      document.getElementById("copia-comprobar").onclick = function () { Copia.comprobar(); };
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
