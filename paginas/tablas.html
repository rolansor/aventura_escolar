<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Tablas de multiplicar — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/ejercicios.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-tablas" class="pantalla activa">
      <div id="tablas-selector" class="selector-categorias"></div>
      <div id="tablas-juego" class="caja-juego oculto">
        <div class="fila-timer"><span class="timer oculto" id="tablas-timer"></span></div>
        <div class="progreso"><div class="progreso-barra" id="tablas-progreso"></div></div>
        <h2 class="pregunta secuencia-numeros" id="tablas-pregunta"></h2>
        <div class="zona-respuesta-libre" id="tablas-resp">
          <input type="number" id="tablas-input" class="entrada-texto" autocomplete="off" placeholder="¿?" />
          <button class="boton-grande" id="tablas-enviar">Comprobar</button>
        </div>
        <p class="retro" id="tablas-retro"></p>
      </div>
    </section>
  </div>

  <div id="luna" title="Perchita — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Perchita 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Perchita ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/tablas.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () {
      const juego = document.getElementById("tablas-juego");
      if (juego && !juego.classList.contains("oculto")) Tablas.volverSelector();
      else location.href = "index.html?materia=matematicas";
    };
    Juego.iniciarBase();
    Tablas.init();
    document.getElementById("tablas-enviar").onclick = function () { Tablas.comprobar(); };
    document.getElementById("tablas-input").addEventListener("keydown", function (e) { if (e.key === "Enter") Tablas.comprobar(); });
  </script>
</body>
</html>
