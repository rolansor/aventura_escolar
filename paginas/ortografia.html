<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Ortografía — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/ejercicios.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-ortografia" class="pantalla activa">
      <div id="ortografia-selector" class="selector-categorias"></div>
      <div id="ortografia-juego" class="caja-juego oculto">
        <div class="fila-timer"><span class="timer oculto" id="orto-timer"></span></div>
        <div class="progreso"><div class="progreso-barra" id="orto-progreso"></div></div>
        <p class="regla-ayuda" id="orto-regla"></p>
        <h2 class="pregunta" id="orto-pregunta"></h2>
        <p class="pista" id="orto-pista"></p>
        <div class="opciones" id="orto-opciones"></div>
        <div class="zona-respuesta-libre oculto" id="orto-libre-zona">
          <input type="text" id="orto-libre-input" class="entrada-texto" autocomplete="off" placeholder="Escribe aquí…" />
          <button class="boton-grande" id="orto-libre-enviar">Comprobar</button>
        </div>
        <p class="retro" id="orto-retro"></p>
      </div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/ortografia.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/ortografia.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () {
      const juego = document.getElementById("ortografia-juego");
      if (juego && !juego.classList.contains("oculto")) Ortografia.volverSelector();
      else location.href = window.RUTA_INICIO;
    };
    Datos.cargar(["ortografia"]).then(function () {
      Juego.iniciarBase();
      Ortografia.init();
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
