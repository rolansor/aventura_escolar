<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Ecuador por cantones — La Aventura de Nelson</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/mapas.css" />
  <link rel="stylesheet" href="css/modulos/cantones.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-cantones" class="pantalla activa">
      <h2 class="titulo-seccion">🗺️ Ecuador por cantones</h2>
      <p class="subtitulo">Pasa el cursor para resaltar una provincia · clic para verla en 3D 🔄</p>
      <div class="mapa-zona" id="mapac-zona">
        <div class="mapa-col-mapa">
          <div id="mapac-svg-cont" class="mapa-svg-cont"></div>
        </div>
      </div>
      <div id="mapac-foco" class="mapac-foco oculto">
        <div class="foco-3d">
          <canvas id="mapac-canvas"></canvas>
          <div class="foco-canton oculto" id="mapac-canton-label"></div>
          <p class="foco-hint">🔄 Arrastra para girar · pasa el cursor por un cantón</p>
        </div>
        <aside class="mapa-detalle" id="mapac-datos"></aside>
      </div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/cantones.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/modos/mapacantones.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    window.MODO_VOLVER = function () {
      if (window.MapaCantones && MapaCantones.enFoco && MapaCantones.enFoco()) MapaCantones.cerrarFoco();
      else location.href = window.RUTA_INICIO;
    };
    Datos.cargar(["cantones"]).then(function () {
      Juego.iniciarBase();
      MapaCantones.init();
      MapaCantones.mostrar();
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
