<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Aventura de Nelson 🚀</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/menu.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono oculto" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-perfil" class="chip-perfil oculto" title="Cambiar de perfil"></button>
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <!-- Selector de perfiles (se muestra al abrir si no hay perfil activo) -->
    <section id="pantalla-perfiles" class="pantalla">
      <h1 class="titulo-juego">La Aventura</h1>
      <p class="subtitulo">¿Quién va a jugar hoy? 🇪🇨</p>
      <div class="tarjetas-menu" id="perfiles-lista"></div>
    </section>

    <!-- Menú de materias -->
    <section id="pantalla-menu" class="pantalla">
      <h1 class="titulo-juego" id="titulo-juego">La Aventura de Nelson</h1>
      <p class="subtitulo" id="subtitulo">¡Hola, Nelson! Elige una materia para empezar 🇪🇨</p>
      <div class="tarjetas-menu" id="tarjetas-menu"></div>
    </section>

    <!-- Submenú de una materia -->
    <section id="pantalla-materia" class="pantalla">
      <h2 class="titulo-seccion" id="materia-titulo"></h2>
      <p class="subtitulo" id="materia-sub">Elige una actividad</p>
      <div class="tarjetas-menu" id="materia-actividades"></div>
    </section>
  </div>

  <div id="luna" title="Luna — ¡arrástrame a donde quieras!">
    <div class="luna-globo" id="luna-globo">¡Hola, Nelson! Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/materias.js"></script>
  <script src="data/nino.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/core/perfiles.js"></script>
  <script src="src/core/menu.js"></script>
  <script>
    window.ES_MENU = true;
    window.RUTA_INICIO = "index.html";
    Datos.cargar(["materias", "nino"]).then(function () {
      Juego.iniciarBase();
      Perfiles.init();
      // Si ya hay un perfil elegido, al menú; si no, al selector de perfiles.
      if (Juego.perfilActivo()) Menu.init();
      else Perfiles.abrir();
    }).catch(function (e) { console.error("Error cargando datos:", e); });
  </script>
</body>
</html>
