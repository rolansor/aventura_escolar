<!-- La cara — dibujo de "Señala la parte" (se incrusta en data/contenido/senala.json con {"$archivo": ...}).
     Partes: pelo, cejas, ojos, orejas, nariz, mejillas, boca. El pelo va en DOS grupos
     (la melena detrás de la cara y el flequillo delante): los dos llevan data-parte="pelo". -->
<svg viewBox="0 0 300 330" class="sen-svg sen-cara" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ca-piel" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#f8d2ab"/><stop offset="1" stop-color="#e0a676"/>
    </radialGradient>
    <linearGradient id="ca-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3122"/><stop offset="1" stop-color="#2a1a11"/>
    </linearGradient>
    <radialGradient id="ca-iris" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8a5a2e"/><stop offset="1" stop-color="#4a2c12"/>
    </radialGradient>
  </defs>

  <!-- cuello y hombros (no son parte del juego) -->
  <path d="M122 262 H178 V296 Q230 300 252 330 H48 Q70 300 122 296 Z" fill="#e0a676"/>
  <path d="M48 330 Q70 300 122 296 Q150 316 178 296 Q230 300 252 330 Z" fill="#7c5cf0"/>

  <!-- PELO: melena (detrás de la cara) -->
  <g data-parte="pelo">
    <path d="M150 20 C70 20 34 80 42 160 C46 214 40 262 62 300 C84 306 100 296 104 268 L98 150 C116 96 184 96 202 150 L196 268 C200 296 216 306 238 300 C260 262 254 214 258 160 C266 80 230 20 150 20 Z" fill="url(#ca-pelo)" stroke="#1d120b" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- OREJAS -->
  <g data-parte="orejas">
    <ellipse cx="60" cy="172" rx="16" ry="25" fill="#e8b185" stroke="#c98a5c" stroke-width="2"/>
    <path d="M56 160 q-7 12 2 24" fill="none" stroke="#c98a5c" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="240" cy="172" rx="16" ry="25" fill="#e8b185" stroke="#c98a5c" stroke-width="2"/>
    <path d="M244 160 q7 12 -2 24" fill="none" stroke="#c98a5c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- cara (fondo; no es una parte) -->
  <path d="M150 62 C96 62 62 100 62 162 C62 230 104 280 150 280 C196 280 238 230 238 162 C238 100 204 62 150 62 Z" fill="url(#ca-piel)" stroke="#c98a5c" stroke-width="2"/>

  <!-- PELO: flequillo (delante de la frente) -->
  <g data-parte="pelo">
    <path d="M60 150 C52 84 100 46 150 46 C200 46 248 84 240 150 C232 116 214 98 190 92 C182 112 168 122 150 104 C136 124 116 118 108 94 C86 100 68 118 60 150 Z" fill="url(#ca-pelo)" stroke="#1d120b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M120 60 q22 -10 44 0" fill="none" stroke="#6b4a36" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- CEJAS -->
  <g data-parte="cejas">
    <path d="M88 142 Q108 126 132 138" fill="none" stroke="#33231a" stroke-width="8" stroke-linecap="round"/>
    <path d="M168 138 Q192 126 212 142" fill="none" stroke="#33231a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- OJOS -->
  <g data-parte="ojos">
    <g class="parpadea">
      <ellipse cx="110" cy="168" rx="23" ry="19" fill="#ffffff" stroke="#33231a" stroke-width="2.5"/>
      <circle cx="111" cy="169" r="12.5" fill="url(#ca-iris)"/>
      <circle cx="111" cy="169" r="6" fill="#170d06"/>
      <circle cx="115.5" cy="164" r="3.6" fill="#ffffff"/>
      <ellipse cx="190" cy="168" rx="23" ry="19" fill="#ffffff" stroke="#33231a" stroke-width="2.5"/>
      <circle cx="189" cy="169" r="12.5" fill="url(#ca-iris)"/>
      <circle cx="189" cy="169" r="6" fill="#170d06"/>
      <circle cx="193.5" cy="164" r="3.6" fill="#ffffff"/>
    </g>
    <path d="M86 160 Q110 140 134 160" fill="none" stroke="#33231a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M166 160 Q190 140 214 160" fill="none" stroke="#33231a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- MEJILLAS -->
  <g data-parte="mejillas">
    <circle cx="92" cy="212" r="20" fill="#ff8e8e" opacity="0.55"/>
    <circle cx="208" cy="212" r="20" fill="#ff8e8e" opacity="0.55"/>
  </g>

  <!-- NARIZ -->
  <g data-parte="nariz">
    <path d="M150 170 C142 190 134 200 134 210 C134 222 166 222 166 210 C166 200 158 190 150 170 Z" fill="#e9b287" stroke="#c98a5c" stroke-width="2" stroke-linejoin="round"/>
    <path d="M142 212 q3 3 6 0 M152 212 q3 3 6 0" fill="none" stroke="#b9794c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- BOCA -->
  <g data-parte="boca">
    <path d="M112 236 Q150 274 188 236 Q150 246 112 236 Z" fill="#c9433a" stroke="#8f2e21" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M122 240 Q150 250 178 240 Q150 256 122 240 Z" fill="#ffffff"/>
  </g>
</svg>
