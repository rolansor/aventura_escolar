<!-- La casa — dibujo de Inglés "My house" (se incrusta en data/contenido/casa.json con {"$archivo": ...}).
     Partes (data-parte): roof, bedroom, bathroom, living, dining, kitchen, garage, garden.
     Cada cuarto lleva su propio fondo: así TODA su superficie sirve para tocarlo o soltarle una ficha.
     El marco de la casa va al final con pointer-events="none" para no estorbar. -->
