<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Regiones y relieves — La Aventura</title>
  <link rel="stylesheet" href="css/modulos/base.css" />
  <link rel="stylesheet" href="css/modulos/ejercicios.css" />
  <link rel="stylesheet" href="css/modulos/efectos.css" />
</head>
<body>
  <canvas id="lienzo3d"></canvas>
  <div id="interfaz">
    <header id="barra-superior">
      <div class="grupo-barra grupo-izq">
        <button id="btn-inicio" class="boton-icono" title="Ir al menú principal">🏠</button>
        <button id="btn-volver-global" class="boton-icono" title="Volver atrás">↩️</button>
      </div>
      <div id="marcador">
        <span class="estrellas">⭐ <b id="puntaje-estrellas">0</b></span>
        <span class="racha">🔥 <b id="puntaje-racha">0</b></span>
        <span class="nivel">Nivel <b id="puntaje-nivel">1</b></span>
      </div>
      <div class="grupo-barra grupo-der">
        <button id="btn-sonido" class="boton-icono" title="Activar/silenciar sonido">🔊</button>
      </div>
    </header>

    <section id="pantalla-regiones" class="pantalla activa">
      <div id="regiones-selector" class="selector-categorias"></div>
      <div id="regiones-juego" class="caja-juego oculto">
        <div class="fila-timer"><span class="timer oculto" id="regiones-timer"></span></div>
        <div class="progreso"><div class="progreso-barra" id="regiones-progreso"></div></div>
        <p class="regla-ayuda" id="regiones-tema"></p>
        <h2 class="pregunta" id="regiones-pregunta"></h2>
        <div id="regiones-extra" class="mc-extra"></div>
        <div class="opciones" id="regiones-opciones"></div>
        <p class="retro" id="regiones-retro"></p>
      </div>
    </section>
  </div>

  <div id="luna" title="Luna">
    <div class="luna-globo" id="luna-globo">Soy Luna 🌙</div>
    <canvas id="luna-canvas"></canvas>
    <div class="luna-nombre">🌙 Luna ✋</div>
  </div>
  <div id="celebracion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>window.THREE || document.write('<scr'+'ipt src="lib/three.min.js"></scr'+'ipt>');</script>
  <script src="src/efectos/escena3d.js"></script>
  <script src="src/efectos/luna.js"></script>
  <script src="data/contenido/regiones.js"></script>
  <script src="src/core/datos.js"></script>
  <script src="src/core/juego.js"></script>
  <script src="src/core/actividad.js"></script>
  <script src="src/core/arrastrar.js"></script>
  <script src="src/core/contenido.js"></script>
  <script>
    window.RUTA_INICIO = "index.html";
    Datos.cargar(["contenido/regiones"]).then(function () {
      Juego.iniciarBase();
      var MODO = Contenido.montar("regiones");
      window.MODO_VOLVER = function () {
        if (!document.getElementById("regiones-juego").classList.contains("oculto")) MODO.volverSelector();
        else location.href = "index.html?materia=sociales";
      };
      MODO.init();
    });
  </script>
</body>
</html>
